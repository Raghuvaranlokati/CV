<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gesture Synth - Demo Videos</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #111;
    color: #e8a13d;
    font-family: monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  header {
    margin-top: 40px;
    margin-bottom: 20px;
    text-align: center;
  }
  h1 {
    text-shadow: 0 0 12px rgba(232, 161, 61, 0.6);
    margin: 0;
    font-size: 32px;
  }
  .nav {
    margin-top: 10px;
  }
  .nav a {
    color: #fff;
    text-decoration: none;
    background: rgba(232, 161, 61, 0.2);
    border: 1px solid #e8a13d;
    padding: 8px 16px;
    border-radius: 4px;
    transition: all 0.2s;
  }
  .nav a:hover {
    background: rgba(232, 161, 61, 0.5);
    color: #fff;
  }
  .videos-container {
    display: flex;
    flex-wrap: wrap;
    gap: 30px;
    justify-content: center;
    padding: 20px;
    max-width: 1200px;
  }
  .video-wrapper {
    background: #1a1a1a;
    border: 1px solid #3a3428;
    border-radius: 8px;
    padding: 15px;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  }
  video {
    max-width: 100%;
    width: 400px;
    border-radius: 4px;
    outline: none;
  }
  .video-title {
    margin-top: 10px;
    font-size: 14px;
    color: #ccc;
  }
</style>
</head>
<body>

<header>
  <h1>Gesture Synth Demos</h1>
  <div class="nav">
    <a href="index.html">← Back to App</a>
  </div>
</header>

<div class="videos-container">
  <div class="video-wrapper">
    <video controls>
      <source src="/Video-18359.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
    <div class="video-title">Demo 1</div>
  </div>
  
  <div class="video-wrapper">
    <video controls>
      <source src="/Video-62231.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
    <div class="video-title">Demo 2</div>
  </div>
</div>

</body>
</html>
